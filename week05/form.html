<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

    <form method="get" action="review.html">

        <div class="form-group">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Choose a Product ...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Overall Rating</label>

            <div class="rating">

                <label class="star-option">
                    <span>★</span>
                    <input type="radio" name="rating" value="1" required>
                </label>

                <label class="star-option">
                    <span>★★</span>
                    <input type="radio" name="rating" value="2">
                </label>

                <label class="star-option">
                    <span>★★★</span>
                    <input type="radio" name="rating" value="3">
                </label>

                <label class="star-option">
                    <span>★★★★</span>
                    <input type="radio" name="rating" value="4">
                </label>

                <label class="star-option">
                    <span>★★★★★</span>
                    <input type="radio" name="rating" value="5">
                </label>

            </div>
        </div>

        <div class="form-group">
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
        </div>

        <div class="form-group">
            <label>Which features did you find useful in the product?</label>
            <p><em>(Check all that apply)</em></p>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label>
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label>
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label>
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>

            </div>
        </div>

        <div class="form-group">
            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="6"></textarea>
        </div>

        <div class="form-group">
            <label for="username">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="username" name="username">
        </div>

        <input type="submit" value="Post Review" class="submit-btn">

    </form>

</main>

<footer>
    <p>&copy; <span id="currentyear"></span> Mailess Luhanga | Zambia</p>
    <p>Last Modification: <span id="lastModified"></span></p>
</footer>

</body>
</html>
