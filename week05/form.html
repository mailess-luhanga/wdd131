<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review with ratings, installation date, useful features, and written feedback.">
    <meta name="author" content="Mailess Luhanga">

    <title>Product Review Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

    <form method="get" action="review.html">

        <div class="form-group">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </div>

        <div class="form-group">
            <label>Overall Rating</label>

            <div class="rating">

                <div class="star-option">
                    <label for="star1">★</label>
                    <input type="radio" id="star1" name="rating" value="1" required>
                </div>

                <div class="star-option">
                    <label for="star2">★★</label>
                    <input type="radio" id="star2" name="rating" value="2" required>
                </div>

                <div class="star-option">
                    <label for="star3">★★★</label>
                    <input type="radio" id="star3" name="rating" value="3" required>
                </div>

                <div class="star-option">
                    <label for="star4">★★★★</label>
                    <input type="radio" id="star4" name="rating" value="4" required>
                </div>

                <div class="star-option">
                    <label for="star5">★★★★★</label>
                    <input type="radio" id="star5" name="rating" value="5" required>
                </div>

            </div>
        </div>

        <div class="form-group">
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
        </div>

        <div class="form-group">
            <label>Which features did you find useful in the product?</label>
            <p><em>(Check all that apply)</em></p>

            <div class="checkbox-group">

                <div class="checkbox-item">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    <label for="durability">Durability</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="ease" name="features" value="Ease of Use">
                    <label for="ease">Ease of Use</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    <label for="performance">Performance</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="design" name="features" value="Design">
                    <label for="design">Design</label>
                </div>

            </div>
        </div>

        <div class="form-group">
            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="6"></textarea>
        </div>

        <div class="form-group">
            <label for="username">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="username" name="username">
        </div>

        <input type="submit" value="Post Review" class="submit-btn">

    </form>

</main>

<footer>
    <p>&copy; <span id="currentyear"></span> Mailess Luhanga | Zambia</p>
    <p>Last Modification: <span id="lastModified"></span></p>
</footer>

</body>
</html>
