<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazy Loading Demo</title>
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
</head>
<body>
  <header>
    <h1>Lazy Loading Images</h1>
  </header>

  <main>
    <h1>My Image Gallery</h1>

    <!-- Six portrait images with lazy loading -->
    <img src="images/cat1.webp" alt="Placeholder 1" loading="lazy">
    <img src="images/cat2.webp" alt="Placeholder 2" loading="lazy">
    <img src="images/cat3.webp" alt="Placeholder 3" loading="lazy">
    <img src="images/cat4.webp" alt="Placeholder 4" loading="lazy">
    <img src="images/cat5.webp" alt="Placeholder 5" loading="lazy">
    <img src="images/cat6.webp" alt="Placeholder 6" loading="lazy">
  </main>

  <footer>
    <p>&copy; 2026 My LazyLoad Page</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
